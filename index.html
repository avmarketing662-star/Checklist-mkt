<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769e0">
  <title>Checklist Operacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="drawer" id="drawer">
      <div class="drawer-top">
        <div class="profile-avatar">JC</div>
        <p>Bem-vindo,</p>
        <h2>João César</h2>
        <span>Loja 01</span>
      </div>
      <nav>
        <button class="nav-link active">⌂ <span>Início</span></button>
        <button class="nav-link">✓ <span>Checklists</span></button>
        <button class="nav-link">! <span>Ocorrências</span></button>
        <button class="nav-link">◷ <span>Histórico</span></button>
        <button class="nav-link">▦ <span>Relatórios</span></button>
        <button class="nav-link">⚙ <span>Configurações</span></button>
      </nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="phone">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div class="brand">
          <span class="brand-mark">✓</span>
          <span>Operacional</span>
        </div>
        <button class="icon-btn notification" aria-label="Notificações">♢<b>2</b></button>
      </header>

      <section class="welcome">
        <p>Bom dia, João 👋</p>
        <h1>Checklists de hoje</h1>
        <span>Loja 01 • Operação</span>
      </section>

      <section class="date-switcher">
        <button id="prevDay" aria-label="Dia anterior">‹</button>
        <div class="date-center">
          <strong id="dateTitle"></strong>
          <span id="weekday"></span>
          <small id="todayLabel"></small>
        </div>
        <button id="nextDay" aria-label="Próximo dia">›</button>
      </section>

      <section class="progress-card">
        <div class="progress-head">
          <div>
            <span>Progresso do dia</span>
            <strong id="progressText">0 de 0 concluídos</strong>
          </div>
          <b id="progressPercent">0%</b>
        </div>
        <div class="progress-track">
          <div id="progressBar"></div>
        </div>
      </section>

      <div class="section-title">
        <h2>Checklists</h2>
        <button id="todayBtn">Hoje</button>
      </div>

      <section class="checklist-list" id="checklistList"></section>

      <section class="empty-state" id="emptyState" hidden>
        <div>✓</div>
        <h3>Nenhum checklist neste dia</h3>
        <p>Use as setas acima para consultar outra data.</p>
      </section>

      <nav class="bottom-nav">
        <button class="active"><span>⌂</span>Início</button>
        <button><span>✓</span>Checklists</button>
        <button><span>!</span>Ocorrências</button>
        <button><span>♙</span>Perfil</button>
      </nav>
    </main>

    <div class="task-modal" id="taskModal" aria-hidden="true">
      <div class="task-sheet">
        <div class="sheet-handle"></div>
        <div class="task-head">
          <button class="back-btn" id="closeTask">‹</button>
          <span>Executar checklist</span>
          <button class="more-btn">•••</button>
        </div>

        <div class="task-content">
          <span class="task-category" id="taskCategory"></span>
          <h2 id="taskTitle"></h2>
          <p id="taskMeta"></p>

          <div class="mini-progress">
            <div><span id="taskCount">0/0</span><b id="taskPercent">0%</b></div>
            <div class="progress-track"><div id="taskProgressBar"></div></div>
          </div>

          <div id="questions"></div>
        </div>

        <div class="task-footer">
          <button id="finishBtn">Salvar checklist</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
